<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>进制转换步骤演示器</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: "Microsoft Yahei", system-ui, sans-serif;
            background: linear-gradient(135deg, #FFF7F0, #F0F8FF);
            padding: 48px 20px;
        }
        .wrap {
            max-width: 960px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            font-weight: 600;
            color: #444;
            margin-bottom: 32px;
            letter-spacing: 2px;
        }
        .container {
            background: #ffffffcc;
            border-radius: 20px;
            padding: 32px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.08);
            display: grid;
            grid-template-columns: 1fr 220px;
            gap: 24px;
            align-items: start;
        }
        .panel {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }
        .row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
        }
        label {
            font-weight: 500;
            color: #333;
        }
        input, select, button {
            padding: 10px 14px;
            border-radius: 10px;
            border: 1px solid #ddd;
            font-size: 16px;
        }
        button {
            background-color: #73a9ff;
            color: white;
            border: none;
            cursor: pointer;
            transition: 0.2s;
        }
        button:hover {
            background-color: #5893ee;
        }
        .result-box {
            min-height: 220px;
            background: #fff;
            border: 1px solid #e6e6e6;
            border-radius: 12px;
            padding: 16px;
            white-space: pre-line;
            font-family: Consolas, monospace;
            line-height: 1.6;
        }
        .nailong-area {
            text-align: center;
        }
        .nailong-area img {
            width: 180px;
            transition: 0.3s;
        }
        .tip {
            margin-top: 12px;
            color: #666;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="wrap">
        <h1>进制转换步骤演示器</h1>
        <div class="container">
            <div class="panel">
                <div class="row">
                    <label>输入十进制整数：</label>
                    <input id="numInput" placeholder="例如：100">
                </div>
                <div class="row">
                    <label>目标进制：</label>
                    <select id="baseSelect">
                        <option value="2">二进制</option>
                        <option value="8">八进制</option>
                        <option value="16">十六进制</option>
                    </select>
                    <button id="calcBtn">开始计算</button>
                    <button id="clearBtn">清空</button>
                </div>
                <div class="result-box" id="outBox">等待输入，点击开始计算查看演算步骤</div>
            </div>
            <div class="nailong-area">
                <img id="nailongImg" src="./nailong_normal.png" alt="奶龙">
                <div class="tip" id="nailongTip">准备就绪</div>
            </div>
        </div>
    </div>

    <script>
        const numInput = document.getElementById('numInput');
        const baseSelect = document.getElementById('baseSelect');
        const calcBtn = document.getElementById('calcBtn');
        const clearBtn = document.getElementById('clearBtn');
        const outBox = document.getElementById('outBox');
        const nailongImg = document.getElementById('nailongImg');
        const nailongTip = document.getElementById('nailongTip');

        calcBtn.onclick = function () {
            const raw = numInput.value.trim();
            const n = parseInt(raw);
            const base = parseInt(baseSelect.value);

            if (!/^-?\d+$/.test(raw) || isNaN(n)) {
                outBox.textContent = '错误：请输入合法整数！';
                nailongImg.src = './nailong_laugh.png';
                nailongTip.textContent = '输入不对哦';
                return;
            }

            if (n === 0) {
                outBox.textContent = `转换结果：0\n除基取余演示：数字为 0，直接为 0`;
                nailongImg.src = './nailong_ok.png';
                nailongTip.textContent = '搞定啦';
                return;
            }

            let text = `将十进制 ${n} 转为 ${base} 进制\n`;
            let val = Math.abs(n);
            const steps = [];

            while (val > 0) {
                const rem = val % base;
                let ch;
                if (rem < 10) ch = rem;
                else ch = String.fromCharCode('A'.charCodeAt(0) + rem - 10);
                steps.unshift(ch);
                text += `${val} ÷ ${base} = ${Math.floor(val / base)}  ··· 余数 ${ch}\n`;
                val = Math.floor(val / base);
            }

            let resStr = steps.join('');
            if (n < 0) resStr = '-' + resStr;
            text += `\n最终结果：${resStr}`;

            outBox.textContent = text;
            nailongImg.src = './nailong_ok.png';
            nailongTip.textContent = '计算完成！';
        };

        clearBtn.onclick = function () {
            numInput.value = '';
            outBox.textContent = '等待输入，点击开始计算查看演算步骤';
            nailongImg.src = './nailong_normal.png';
            nailongTip.textContent = '准备就绪';
        };
    </script>
</body>
</html>
