name: Mirror Gitee to GitHub

# 每小时跑一次，同时支持手动触发
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

# 让 workflow 有推送权限
permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitHub repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Mirror branches from Gitee
        run: |
          set -e
          git remote add gitee https://gitee.com/IRISBAI/Computer-seminar-assignment.git || true

          # 逐个拉取 Gitee 上的分支并推到 GitHub
          # 用 ls-remote 直接读 Gitee 真实分支列表，避免本地 ref 干扰
          git ls-remote --heads gitee | while read sha ref; do
            branch="${ref#refs/heads/}"
            echo "=== Syncing branch: $branch ==="
            git fetch gitee "$ref"
            # 只在 fast-forward 时推送；如果 GitHub 分支领先或分叉，跳过不覆盖
            if git push origin "FETCH_HEAD:refs/heads/$branch"; then
              echo "OK: $branch"
            else
              echo "SKIP: $branch (GitHub has newer or diverged commits, not overwriting)"
            fi
          done

          echo "=== Branches synced ==="

      - name: Mirror tags from Gitee
        run: |
          set -e
          # 逐个同步标签
          git ls-remote --tags gitee | grep -v '\^{}$' | while read sha ref; do
            tag="${ref#refs/tags/}"
            echo "=== Syncing tag: $tag ==="
            git fetch gitee "$ref"
            git push origin "FETCH_HEAD:refs/tags/$tag" || true
          done
          echo "=== Tags synced ==="
